<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta name="robots" content="noindex, follow"/>
  <title>Créer un compte — KALEO GROUPE</title>
  <link rel="icon" type="image/png" href="/logo-kaleo.png"/>
  <link rel="stylesheet" href="/css/style.css?v=37"/>
  <link rel="stylesheet" href="/css/animations.css?v=5"/>
  <link rel="stylesheet" href="/css/devis.css?v=8"/>
  <link rel="stylesheet" href="/css/boutique.css?v=11"/>
  <link rel="stylesheet" href="/css/chatbot.css?v=6"/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="/logo-kaleo.webp" alt="KALEO GROUPE Logo" class="logo-img-nav"/>

      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Accueil</a></li>
        <li><a href="/boutique">Boutique</a></li>
        <li id="navAccount"></li>
        <li><a href="/panier" class="cart-icon-link" aria-label="Panier"><i class="fas fa-cart-shopping"></i><span class="cart-badge" id="cartBadge">0</span></a></li>
      </ul>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <span class="section-eyebrow">Compte client</span>
      <h1>Créer un <span class="accent">compte</span></h1>
      <p>Suivez facilement toutes vos commandes.</p>
    </div>
  </div>

  <section class="devis-section">
    <div class="container">
      <div class="checkout-layout" style="max-width: 480px; margin: 0 auto; grid-template-columns: 1fr;">
        <div class="devis-form-wrap reveal">
          <div class="form-card">
            <h2 class="form-title">Inscription</h2>
            <p class="form-subtitle">Déjà un compte ? <a href="/compte/connexion" class="accent" style="text-decoration:underline;">Connectez-vous</a>.</p>

            <div class="checkout-error" id="registerError"></div>

            <form id="registerForm" novalidate>
              <div class="form-group">
                <label for="regName">Nom complet *</label>
                <input type="text" id="regName" required/>
              </div>
              <div class="form-group">
                <label for="regEmail">Email *</label>
                <input type="email" id="regEmail" required/>
              </div>
              <div class="form-group">
                <label for="regPhone">Téléphone</label>
                <input type="tel" id="regPhone" placeholder="+225 07 00 00 00 00"/>
              </div>
              <div class="form-group">
                <label for="regPassword">Mot de passe * <span class="multi-hint">(8 caractères minimum)</span></label>
                <input type="password" id="regPassword" required minlength="8"/>
              </div>
              <div class="form-nav">
                <button type="submit" class="btn-primary btn-large" id="registerBtn" style="width:100%; justify-content:center;">
                  Créer mon compte
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: 1px solid var(--border); padding-top: 24px;">
        <p>© 2026 KALEO GROUPE. Tous droits réservés.</p>
      </div>
    </div>
  </footer>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/cart.js?v=1"></script>
  <script src="/js/customer-auth.js?v=3"></script>
  <script src="/js/main.js?v=3"></script>
  <script src="/js/chatbot.js?v=7"></script>
  <script src="/js/inscription.js?v=1"></script>
</body>
</html>
