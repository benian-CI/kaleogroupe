<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://www.gstatic.com https://res.cloudinary.com; connect-src 'self' http://localhost:4000 https://api.kaleogroupe.com https://kaleo-groupe-backend.onrender.com; frame-src https://www.google.com https://recaptcha.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta name="robots" content="noindex, follow"/>
  <title>Mot de passe oublié — KALEO GROUPE</title>
  <link rel="icon" type="image/png" href="/logo-kaleo-icone.png"/>
  <link rel="stylesheet" href="/css/style.css?v=62"/>
  <link rel="stylesheet" href="/css/animations.css?v=7"/>
  <link rel="stylesheet" href="/css/devis.css?v=29"/>
  <link rel="stylesheet" href="/css/boutique.css?v=12"/>
  <link rel="stylesheet" href="/css/chatbot.css?v=26"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="/logo-kaleo.webp" alt="KALEO GROUPE Logo" class="logo-img-nav"/>

      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Accueil</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/boutique">Boutique</a></li>
        <li><a href="/realisations">Réalisations</a></li>
        <li><a href="/devis" class="btn-nav">Devis gratuit</a></li>
        <li><a href="/contact">Contact</a></li>
        <li id="navAccount"></li>
        <li><a href="/panier" class="cart-icon-link" aria-label="Panier"><i class="fas fa-cart-shopping"></i><span class="cart-badge" id="cartBadge">0</span></a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <span class="section-eyebrow">Compte client</span>
      <h1>Mot de passe <span class="accent">oublié</span></h1>
      <p>Recevez un lien par email pour en choisir un nouveau.</p>
    </div>
  </div>

  <section class="devis-section">
    <div class="container">
      <div class="checkout-layout" style="max-width: 480px; margin: 0 auto; grid-template-columns: 1fr;">
        <div class="devis-form-wrap reveal">
          <div class="form-card">
            <h2 class="form-title">Réinitialiser</h2>
            <p class="form-subtitle">Indiquez l'email de votre compte. <a href="/compte/connexion" class="accent" style="text-decoration:underline;">Retour à la connexion</a></p>

            <div class="checkout-error" id="forgotError"></div>
            <div class="checkout-success" id="forgotSuccess" style="display:none;"></div>

            <form id="forgotForm" novalidate>
              <div class="form-group">
                <label for="forgotEmail">Email *</label>
                <input type="email" id="forgotEmail" required/>
              </div>
              <div class="form-nav">
                <button type="submit" class="btn-primary btn-large" id="forgotBtn" style="width:100%; justify-content:center;">
                  Envoyer le lien
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: 1px solid var(--border); padding-top: 24px;">
        <p>© 2026 KALEO GROUPE. Tous droits réservés.</p>
      </div>
    </div>
  </footer>

  <script src="/js/config.js?v=4"></script>
  <script src="/js/cart.js?v=2"></script>
  <script src="/js/customer-auth.js?v=3"></script>
  <script src="/js/main.js?v=3"></script>
  <script src="/js/chatbot.js?v=8"></script>
  <script src="/js/mot-de-passe-oublie.js?v=1"></script>
</body>
</html>
